name: deploy-shouldiplay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-shouldiplay
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          SHOULDI_PLAY_SSH_PRIVATE_KEY: ${{ secrets.SHOULDI_PLAY_SSH_PRIVATE_KEY }}
          SHOULDI_PLAY_HOST: ${{ secrets.SHOULDI_PLAY_HOST }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${STEAM_API_KEY:-}" ] || missing+=(STEAM_API_KEY)
          [ -n "${SHOULDI_PLAY_SSH_PRIVATE_KEY:-}" ] || missing+=(SHOULDI_PLAY_SSH_PRIVATE_KEY)
          [ -n "${SHOULDI_PLAY_HOST:-}" ] || missing+=(SHOULDI_PLAY_HOST)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}. See SECRETS.md"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          image=ghcr.io/invoke-systems/steam-suggestions
          tag="${{ github.sha }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHOULDI_PLAY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SHOULDI_PLAY_HOST }}
          IMAGE: ${{ steps.meta.outputs.ref }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -R "[${SSH_HOST}]:2222" -f ~/.ssh/known_hosts 2>/dev/null || true

          SSH=(ssh -p 2222 -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key)
          SCP=(scp -P 2222 -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key)

          for i in $(seq 1 30); do
            if "${SSH[@]}" "matth@${SSH_HOST}" 'test -f /var/log/stackscript-complete'; then
              break
            fi
            echo "SSH/stackscript not ready (attempt $i/30); retrying in 20s..."
            sleep 20
            if [ "$i" -eq 30 ]; then
              echo "::error::SSH never became available on ${SSH_HOST}"
              exit 1
            fi
          done

          umask 077
          cat > /tmp/shouldiplay.env <<EOF
          STEAM_API_KEY=${STEAM_API_KEY}
          ALLOW_CLIENT_API_KEY=false
          PUBLIC_URL=https://shouldiplay.co
          STEAM_CC=us
          STEAM_CURRENCY=USD
          ITAD_API_KEY=${ITAD_API_KEY:-}
          UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
          UMAMI_SCRIPT_URL=https://analytics.invoke.systems/recorder.js
          UMAMI_SAMPLE_RATE=0.15
          UMAMI_MASK_LEVEL=moderate
          UMAMI_MAX_DURATION=300000
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/shouldiplay.env

          "${SCP[@]}" deploy/docker-compose.prod.yml "matth@${SSH_HOST}:/etc/sites/shouldiplay.co/docker-compose.yml"
          "${SCP[@]}" /tmp/shouldiplay.env "matth@${SSH_HOST}:/etc/sites/shouldiplay.co/.env"
          rm -f /tmp/shouldiplay.env

          "${SSH[@]}" "matth@${SSH_HOST}" \
            "echo $(printf %q "$GHCR_TOKEN") | docker login ghcr.io -u $(printf %q "$GHCR_USER") --password-stdin && \
             cd /etc/sites/shouldiplay.co && mkdir -p data && chmod 600 .env && \
             IMAGE=$(printf %q "$IMAGE") docker compose pull && \
             IMAGE=$(printf %q "$IMAGE") docker compose up -d --remove-orphans && \
             docker image prune -f"

          rm -f ~/.ssh/deploy_key
