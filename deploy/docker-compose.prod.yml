# Production compose for shouldiplay.co — image pulled from GHCR, not built on the host.
services:
  web:
    image: ${IMAGE}
    ports:
      - "127.0.0.1:3847:3847"
    env_file:
      - .env
    environment:
      STEAM_CC: ${STEAM_CC:-us}
      STEAM_CURRENCY: ${STEAM_CURRENCY:-USD}
      ALLOW_CLIENT_API_KEY: "false"
      PUBLIC_URL: ${PUBLIC_URL:-https://shouldiplay.co}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-https://analytics.invoke.systems/recorder.js}
      UMAMI_SAMPLE_RATE: ${UMAMI_SAMPLE_RATE:-0.15}
      UMAMI_MASK_LEVEL: ${UMAMI_MASK_LEVEL:-moderate}
      UMAMI_MAX_DURATION: ${UMAMI_MAX_DURATION:-300000}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    image: ${IMAGE}
    command: ["/app/worker", "-every", "6h"]
    env_file:
      - .env
    environment:
      STEAM_CC: ${STEAM_CC:-us}
      STEAM_CURRENCY: ${STEAM_CURRENCY:-USD}
      ITAD_API_KEY: ${ITAD_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
